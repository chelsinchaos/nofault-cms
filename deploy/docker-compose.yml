# Hardened, onion-only deployment of the zero-knowledge relay.
#
#   NOFAULT_RELAY_SECRET=<64+ hex chars>  \
#   NOFAULT_RELAY_ALLOWLIST=<hex publisher verify-keys, comma-separated> \
#   docker compose -f deploy/docker-compose.yml up --build
#
# There are NO published host ports. The relay is reachable ONLY through the Tor
# v3 onion service published by the `tor` sidecar. Secrets are injected at
# runtime from the environment, never baked into the image.

services:
  relay:
    build:
      context: ..
      dockerfile: deploy/relay.Dockerfile
    environment:
      NOFAULT_RELAY_SECRET: ${NOFAULT_RELAY_SECRET:?set NOFAULT_RELAY_SECRET (hex, >=32 bytes)}
      NOFAULT_RELAY_ALLOWLIST: ${NOFAULT_RELAY_ALLOWLIST:-}
    volumes:
      - relay_data:/data
    networks: [onion_net]
    read_only: true            # immutable container FS
    tmpfs:
      - /tmp
    cap_drop: [ALL]            # the relay needs no Linux capabilities
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      # loopback-only; never exposed to the host
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8800/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

  tor:
    image: ghcr.io/hyperbolic2346/tor:latest  # pin by digest in production
    depends_on: [relay]
    volumes:
      - ./torrc:/etc/tor/torrc:ro
      - tor_hidden_service:/var/lib/tor/nofault   # persists the .onion key
    networks: [onion_net]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  onion_net:
    driver: bridge
    internal: true   # no egress; the tor sidecar handles all outside contact

volumes:
  relay_data:
  tor_hidden_service:
